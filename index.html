<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
</head>

<body>
    <div class="game-container">
        <h1>Tic-Tac-Toe</h1>

        <div class="game-board">
            <button data-id="0-0" onclick="placeSymbol(0, 0)" class="cell"></button>
            <button data-id="0-1" onclick="placeSymbol(0, 1)" class=" cell"></button>
            <button data-id="0-2" onclick="placeSymbol(0, 2)" class="cell"></button>
            <button data-id="1-0" onclick="placeSymbol(1, 0)" class="cell"></button>
            <button data-id="1-1" onclick="placeSymbol(1, 1)" class="cell"></button>
            <button data-id="1-2" onclick="placeSymbol(1, 2)" class="cell"></button>
            <button data-id="2-0" onclick="placeSymbol(2, 0)" class="cell"></button>
            <button data-id="2-1" onclick="placeSymbol(2, 1)" class="cell"></button>
            <button data-id="2-2" onclick="placeSymbol(2, 2)" class="cell"></button>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>
</body>

</html>
